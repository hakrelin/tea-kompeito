<template id="view-works">
  <div data-view="works" class="panel-body">
    <div class="works">
      <section class="catalog" aria-labelledby="catalog-heading">
        <div class="page-head catalog-head">
          <h2 id="catalog-heading">作品</h2>
          <span class="catalog-count" role="status" aria-atomic="true"></span>
        </div>
        <p class="sample-note catalog-note">示例作品 · 画面为站点插画</p>
        <p class="empty" role="status" hidden>没有找到对应的作品，换个关键词试试。</p>
        <div class="catalog-scroll" id="catalog-scroll" role="region" aria-label="作品列表" tabindex="0">
          <div class="works-grid" id="works-grid">
          </div>
        </div>
        <input type="range" class="catalog-scrollbar" id="catalog-scrollbar" min="0" max="100" value="0"
          aria-label="滚动作品列表" aria-controls="catalog-scroll" aria-orientation="vertical" hidden>
      </section>

      <aside class="detail" id="work-detail" tabindex="-1" aria-labelledby="d-name" hidden>
        <div class="rule"></div>
        <img class="cover" id="d-cover" alt="" width="588" height="836">
        <div class="detail-copy">
          <h3 class="name" id="d-name" aria-live="polite"></h3>
          <div class="detail-meta">
            <p class="detail-original" id="d-orig" lang="ja"></p>
            <p class="detail-status"><span id="d-type"></span><span id="d-status"></span></p>
          </div>
          <dl>
            <dt>图源</dt><dd id="d-source"></dd>
            <dt>翻译</dt><dd id="d-tl"></dd>
            <dt>嵌字</dt><dd id="d-et"></dd>
            <dt>修图</dt><dd id="d-tw"></dd>
            <dt>校对</dt><dd id="d-pr"></dd>
            <dt>链接</dt><dd id="d-link"></dd>
          </dl>
        </div>
        <details class="work-extra">
          <summary>作品简介</summary>
          <p id="d-desc"></p>
        </details>
        <div class="detail-navigation" role="group" aria-label="切换作品" hidden>
          <button type="button" class="page-turn page-turn--previous" data-work-step="-1" aria-controls="work-detail">
            <span class="turn-arrow" aria-hidden="true"></span>上一部
          </button>
          <button type="button" class="page-turn" data-work-step="1" aria-controls="work-detail">
            下一部<span class="turn-arrow" aria-hidden="true"></span>
          </button>
        </div>
        <a class="back-to-works" href="#works-grid">返回作品列表</a>
      </aside>
    </div>
  </div>
</template>
