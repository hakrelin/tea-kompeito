# 默认站点：直接拿 IP 或未绑定 Host 访问时，也给你看到站点内容（方便上线前用 IP 测试）
# 上线后想隐藏，把 root 指向空的 /www/wwwroot/default 或整段改成 return 444;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /www/wwwroot/tea-kompeito.com;
    index index.html index.htm;

    charset utf-8;
    access_log /www/wwwlogs/default.access.log;
    error_log  /www/wwwlogs/default.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
