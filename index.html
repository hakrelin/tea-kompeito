<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tea-kompeito 汉化组</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2b3a55 0%, #131722 55%, #0b0e14 100%);
    color: #e8edf7; padding: 24px;
  }
  .card {
    width: min(680px, 100%); padding: 40px 36px; border-radius: 20px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: .5px; }
  .sub { color: #9fb0cc; margin-bottom: 26px; font-size: 14px; }
  .tag {
    display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: rgba(90,170,255,.15); color: #7cc0ff; border: 1px solid rgba(90,170,255,.3);
    margin-bottom: 18px;
  }
  ul { padding-left: 20px; line-height: 1.9; color: #c7d3e6; font-size: 15px; }
  code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .foot { margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1);
          font-size: 13px; color: #7b8aa3; }
</style>
</head>
<body>
  <main class="card">
    <div class="tag">站点已就绪 · Nginx 占位页</div>
    <h1>tea-kompeito 汉化组</h1>
    <p class="sub">站点根目录 <code>/www/wwwroot/tea-kompeito.com</code> —— 把 <code>index.html</code> 换成你的正式首页即可上线。</p>
    <ul>
      <li>静态站：直接放 HTML / 图片 / 补丁包</li>
      <li>WordPress / Discuz：放到同目录，配置数据库后访问 <code>/wp-admin</code> 安装</li>
      <li>上传的文件建议放 <code>uploads/</code>、<code>downloads/</code>（已禁止执行 PHP）</li>
    </ul>
    <div class="foot">若看到这一页说明 Nginx 已正常运行；下一步是域名解析 + 安全组放行 80/443。</div>
  </main>
</body>
</html>
