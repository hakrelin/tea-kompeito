# =============================================================
#  tea-kompeito.com  站点配置   (Nginx)
#  站点根目录: /www/wwwroot/tea-kompeito.com
#  修改后: nginx -t && systemctl reload nginx
# =============================================================
server {
    listen 80;
    listen [::]:80;
    server_name tea-kompeito.com www.tea-kompeito.com;

    root  /www/wwwroot/tea-kompeito.com;
    index index.php index.html index.htm;

    charset utf-8;
    access_log /www/wwwlogs/tea-kompeito.com.access.log;
    error_log  /www/wwwlogs/tea-kompeito.com.error.log warn;

    # 汉化补丁包普遍偏大，放宽上传上限
    client_max_body_size 128m;

    # 静态资源 / 补丁包 缓存
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf|zip|7z|rar|apk|exe|torrent)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP 支持：纯静态站可以把下面整段删掉 ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # 禁止访问 .git / .env 等隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 禁止直接执行上传目录里的脚本（WordPress 等后台被挂马的高发点）
    location ~* ^/(uploads|attachments|downloads)/.*\.(php|phtml|php5)$ {
        deny all;
    }
}
