# ============================================================
# jusic 听歌站的域名入口（合并版）
#   443: zjz.northwind.site   → *.northwind.site 证书
#   443: zjz.tea-sugar.xyz    → *.tea-sugar.xyz 证书
#   80 : 两个域名统一 301 到 https（用 $host 保留原域名）
# 共用参数：/etc/nginx/snippets/jusic-ssl.inc（SSL）、/etc/nginx/snippets/jusic-proxy.inc（反代）
# 主站不受影响：tea-sugar.xyz / www / 裸 IP 仍是静态笔记站，分别由
#   tea-sugar-static.conf、zz-tea-sugar-443.conf、jusic-ip-443.conf(default_server) 负责
# 回滚：rm -f /etc/nginx/conf.d/zz-jusic-domains.conf && nginx -t && systemctl reload nginx
# ============================================================

# ---------- 80：两个域名统一跳 https ----------
# 不写 default_server，80 的默认站仍是 tea-sugar-static.conf
server {
    listen 80;
    listen [::]:80;
    server_name zjz.northwind.site zjz.tea-sugar.xyz;
    return 301 https://$host$request_uri;
}

# ---------- 443：朋友域名（*.northwind.site 证书） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zjz.northwind.site;

    ssl_certificate     /etc/nginx/ssl/zjz.northwind.site/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/zjz.northwind.site/private.key;
    include /etc/nginx/snippets/jusic-ssl.inc;

    access_log /var/log/nginx/zjz-northwind-443.access.log;
    error_log  /var/log/nginx/zjz-northwind-443.error.log warn;

    include /etc/nginx/snippets/jusic-proxy.inc;
}

# ---------- 443：自己的域名（*.tea-sugar.xyz 证书） ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zjz.tea-sugar.xyz;

    ssl_certificate     /etc/nginx/ssl/tea-sugar.xyz/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/tea-sugar.xyz/private.key;
    include /etc/nginx/snippets/jusic-ssl.inc;

    access_log /var/log/nginx/zjz-tea-sugar-443.access.log;
    error_log  /var/log/nginx/zjz-tea-sugar-443.error.log warn;

    include /etc/nginx/snippets/jusic-proxy.inc;
}
