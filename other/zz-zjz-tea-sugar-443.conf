# zjz.tea-sugar.xyz -> jusic 听歌站
# 复用 /etc/nginx/ssl/tea-sugar.xyz 那张 Let's Encrypt 证书（SAN 含 *.tea-sugar.xyz）
# 主站 tea-sugar.xyz / www.tea-sugar.xyz / 裸 IP 仍然是静态笔记站，本文件只新增这个子域
# 回滚：rm -f /etc/nginx/conf.d/zz-zjz-tea-sugar-443.conf && nginx -t && systemctl reload nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zjz.tea-sugar.xyz;

    ssl_certificate     /etc/nginx/ssl/tea-sugar.xyz/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/tea-sugar.xyz/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLZJZTS:5m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;
    access_log /var/log/nginx/zjz-tea-sugar-443.access.log;
    error_log  /var/log/nginx/zjz-tea-sugar-443.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
