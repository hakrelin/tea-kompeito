; =============================================================
;  PHP-FPM 调优（1.6G 小内存机器专用）
;  放在 /etc/php-fpm.d/zz-custom.conf 覆盖默认 www 池配置
;  改完: systemctl restart php-fpm
; =============================================================
[www]
user = nginx
group = nginx

listen = /run/php-fpm/www.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; ondemand = 没请求就不占内存（小机器首选）
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[post_max_size] = 128M
php_admin_value[max_execution_time] = 120
php_admin_flag[expose_php] = off
